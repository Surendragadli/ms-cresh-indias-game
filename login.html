<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms Cresh - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: #020617; 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #020617 100%);
            padding: 20px;
        }

        /* LOGO SECTION */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .logo-container .crown-icon {
            color: #ffcc00; font-size: 40px; margin-bottom: -10px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }
        .logo-container .main-text {
            font-size: 45px; font-weight: 900; color: #ffcc00;
            text-shadow: 2px 2px 0px #000, 0 0 20px rgba(255, 204, 0, 0.6);
            line-height: 1; font-style: italic; display: inline-block;
        }
        .logo-container .main-text span { color: #ffffff; text-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
        .logo-container .game-text {
            font-family: 'Great Vibes', cursive; font-size: 30px; color: #ffcc00;
            text-shadow: 2px 2px 4px #000; margin-top: -5px;
        }

        /* LOGIN FORM CARD */
        .login-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #3b82f6;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            text-align: center;
        }
        .login-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* INPUT FIELDS */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3b82f6;
            font-size: 18px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #64748b;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
        }

        /* LINKS */
        .links-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links-container a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .links-container a:hover { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        
        .register-link span { color: #ffcc00; font-weight: 800; }
    </style>
</head>
<body>

    <!-- Logo Section -->
    <div class="logo-container">
        <i class="fa-solid fa-crown crown-icon"></i><br>
        <div class="main-text">MS <span>CRESH</span></div>
        <div class="game-text">GAME</div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <h2>Welcome Back</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="number" id="mobile" placeholder="Mobile Number" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">LOG IN <i class="fa-solid fa-right-to-bracket"></i></button>
        </form>

        <div class="links-container">
            <a href="#" onclick="alert('Forgot Password coming soon!')">Forgot Password?</a>
            <a href="skskindex.html" class="register-link">Don't have an account? <span>Register Here</span></a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Page refresh hone se roke

            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Button ka text change karein jab tak load ho
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Please Wait...';
            loginBtn.disabled = true;

            try {
                // Backend server par data bhejna (API jab live hogi tab ye fully kaam karega)
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert("✅ " + data.message);
                    localStorage.setItem('savedMobile', data.mobile);
                    localStorage.setItem('userBalance', data.balance);
                    
                    window.location.href = 'skuskeskkkloginhome.html';
                } else {
                    alert("❌ " + data.message);
                    loginBtn.innerHTML = 'LOG IN <i class="fa-solid fa-right-to-bracket"></i>';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Server Error! Please check your internet or try again later.");
                loginBtn.innerHTML = 'LOG IN <i class="fa-solid fa-right-to-bracket"></i>';
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
