<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms Cresh - Premium Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: #000511; 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Space background feel */
            background-image: radial-gradient(circle at top, #0a1f44 0%, #000511 80%);
            padding: 20px;
        }

        /* PREMIUM LOGO */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .logo-container .crown-icon {
            color: #ffcc00; font-size: 35px; margin-bottom: -5px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }
        .logo-container .main-text {
            font-size: 50px; font-weight: 900; color: #ffcc00;
            text-shadow: 2px 2px 0px #000, 0 0 20px rgba(255, 204, 0, 0.8);
            line-height: 1; font-style: italic; display: block;
        }
        .logo-container .main-text span { 
            color: #ffffff; 
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.9), 2px 2px 0px #000; 
        }
        .logo-container .game-text {
            font-family: 'Great Vibes', cursive; font-size: 35px; color: #ffcc00;
            text-shadow: 2px 2px 4px #000, 0 0 10px #ffcc00; margin-top: -10px;
        }

        /* FEATURES BAR */
        .features-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 10px 15px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }
        .feature-item i {
            color: #ffcc00;
            font-size: 20px;
            text-shadow: 0 0 8px #ffcc00;
        }
        .feature-divider { width: 1px; height: 30px; background: #ffcc00; opacity: 0.5; }

        /* GOLDEN REGISTER CARD */
        .register-card {
            background: linear-gradient(180deg, #0a1128, #00040a);
            border: 3px solid #ffcc00;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
        }
        
        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card-header i.wing { color: #ffcc00; font-size: 24px; text-shadow: 0 0 10px #ffcc00; }
        .card-header h2 {
            font-size: 26px; font-weight: 900; color: #ffcc00;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
            display: flex; flex-direction: column; align-items: center;
        }
        .card-header h2 .crown-small { font-size: 14px; margin-bottom: -5px; }

        /* NEON BLUE INPUTS */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group i.icon-left {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #ffffff; font-size: 18px;
        }
        .input-group i.icon-right {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: #ffffff; font-size: 18px; cursor: pointer;
        }
        .input-group input {
            width: 100%;
            padding: 15px 45px;
            background: rgba(0, 20, 50, 0.5);
            border: 2px solid #00d2ff;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.3), 0 0 10px rgba(0, 210, 255, 0.2);
            transition: 0.3s;
        }
        .input-group input::placeholder { color: #8bb4e6; font-weight: 600; }
        .input-group input:focus { box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.6), 0 0 15px rgba(0, 210, 255, 0.5); }

        /* BUTTONS */
        .register-btn {
            width: 100%;
            background: linear-gradient(180deg, #fff700, #ff8c00);
            border: none;
            color: #000;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 10px; transition: 0.3s;
        }
        .register-btn:active { transform: scale(0.98); }

        .divider {
            display: flex; align-items: center; text-align: center; color: white;
            margin: 20px 0; font-weight: bold; font-size: 14px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ffffff; margin: 0 15px; opacity: 0.5; }

        .login-btn-alt {
            width: 100%;
            background: #001233;
            border: 2px solid #00d2ff;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.3), 0 0 15px rgba(0, 210, 255, 0.3);
            transition: 0.3s;
        }

        .footer-text {
            text-align: center; margin-top: 25px; color: #ffcc00;
            font-family: 'Great Vibes', cursive; font-size: 24px;
            text-shadow: 0 0 10px #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Logo -->
    <div class="logo-container">
        <i class="fa-solid fa-crown crown-icon"></i><br>
        <div class="main-text">MS<br><span>CRESH</span></div>
        <div class="game-text">Game</div>
    </div>

    <!-- Features Bar -->
    <div class="features-bar">
        <div class="feature-item"><i class="fa-solid fa-bolt"></i> Fast<br>Withdrawal</div>
        <div class="feature-divider"></div>
        <div class="feature-item"><i class="fa-solid fa-wallet"></i> Fast<br>Deposit</div>
        <div class="feature-divider"></div>
        <div class="feature-item"><i class="fa-solid fa-shield-halved"></i> Safe<br>Game</div>
    </div>

    <!-- Golden Register Card -->
    <div class="register-card">
        <div class="card-header">
            <i class="fa-solid fa-dove wing"></i>
            <h2><i class="fa-solid fa-crown crown-small"></i> REGISTER</h2>
            <i class="fa-solid fa-dove wing" style="transform: scaleX(-1);"></i>
        </div>
        
        <form id="registerForm">
            <!-- Mobile Input -->
            <div class="input-group">
                <i class="fa-solid fa-mobile-screen icon-left"></i>
                <input type="tel" id="mobile" placeholder="MOBILE NUMBER" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            
            <!-- Password Input -->
            <div class="input-group">
                <i class="fa-solid fa-lock icon-left"></i>
                <input type="password" id="password" placeholder="PASSWORD" required>
                <i class="fa-solid fa-eye-slash icon-right" onclick="togglePassword()"></i>
            </div>

            <!-- Invite Code Input -->
            <div class="input-group">
                <i class="fa-solid fa-user-group icon-left"></i>
                <input type="text" id="inviteCode" placeholder="INVITE CODE (Optional)">
            </div>
            
            <button type="submit" class="register-btn" id="regBtn">
                <i class="fa-solid fa-user-plus"></i> REGISTER <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider">OUR</div>

        <!-- Direct Login Button -->
        <a href="login.html" class="login-btn-alt">
            <i class="fa-solid fa-right-to-bracket"></i> LOGIN <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <!-- Footer Text -->
    <div class="footer-text">Play • Win • Earn</div>

    <script>
        // Password Show/Hide Feature
        function togglePassword() {
            let passInput = document.getElementById("password");
            let icon = document.querySelector(".icon-right");
            if (passInput.type === "password") {
                passInput.type = "text";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                passInput.type = "password";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
        }

        // Registration Logic with Backend
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const regBtn = document.getElementById('regBtn');

            // 10-Digit Check
            if (mobile.length !== 10) {
                alert("❌ Please enter exactly 10 digit mobile number!");
                return;
            }

            regBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> WAIT...';
            regBtn.disabled = true;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert("✅ Registration Successful! ₹59 Bonus Added.");
                    window.location.href = 'login.html';
                } else {
                    alert("❌ " + data.message);
                    regBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> REGISTER <i class="fa-solid fa-arrow-right"></i>';
                    regBtn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Server Error! Please check your internet connection.");
                regBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> REGISTER <i class="fa-solid fa-arrow-right"></i>';
                regBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
