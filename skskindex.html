<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms Cresh - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: #020617; 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #020617 100%);
            padding: 20px;
        }

        /* LOGO SECTION */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .logo-container .crown-icon {
            color: #ffcc00; font-size: 40px; margin-bottom: -10px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }
        .logo-container .main-text {
            font-size: 45px; font-weight: 900; color: #ffcc00;
            text-shadow: 2px 2px 0px #000, 0 0 20px rgba(255, 204, 0, 0.6);
            line-height: 1; font-style: italic; display: inline-block;
        }
        .logo-container .main-text span { color: #ffffff; text-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
        .logo-container .game-text {
            font-family: 'Great Vibes', cursive; font-size: 30px; color: #ffcc00;
            text-shadow: 2px 2px 4px #000; margin-top: -5px;
        }

        /* REGISTER FORM CARD */
        .login-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #3b82f6;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            text-align: center;
        }
        .login-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bonus-badge {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        /* INPUT FIELDS */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #3b82f6;
            font-size: 18px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #64748b;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* REGISTER BUTTON */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
        }

        /* LINKS */
        .links-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .register-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .register-link span { color: #00d2ff; font-weight: 800; }
        .register-link:hover span { text-shadow: 0 0 10px rgba(0, 210, 255, 0.8); }
    </style>
</head>
<body>

    <div class="logo-container">
        <i class="fa-solid fa-crown crown-icon"></i><br>
        <div class="main-text">MS <span>CRESH</span></div>
        <div class="game-text">GAME</div>
    </div>

    <div class="login-card">
        <h2>Create Account</h2>
        <div class="bonus-badge"><i class="fa-solid fa-gift"></i> Get ₹59 Free Bonus</div>
        
        <form id="registerForm">
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <!-- 10 DIGIT CHECK LAGA DIYA HAI -->
                <input type="tel" id="mobile" placeholder="10 Digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Set Password" required>
            </div>
            
            <button type="submit" class="login-btn" id="regBtn">REGISTER NOW <i class="fa-solid fa-user-plus"></i></button>
        </form>

        <div class="links-container">
            <a href="login.html" class="register-link">Already have an account? <span>Login Here</span></a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const regBtn = document.getElementById('regBtn');

            // EXTRA JAVASCRIPT CHECK FOR 10 DIGITS
            if (mobile.length !== 10) {
                alert("❌ Please enter exactly 10 digit mobile number!");
                return;
            }

            regBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Please Wait...';
            regBtn.disabled = true;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert("✅ " + data.message); // Yahan success hone par bonus ka message aayega
                    window.location.href = 'login.html';
                } else {
                    alert("❌ " + data.message); // Agar number pehle se hai toh yahan alert dega
                    regBtn.innerHTML = 'REGISTER NOW <i class="fa-solid fa-user-plus"></i>';
                    regBtn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Server Error! Please check your internet connection.");
                regBtn.innerHTML = 'REGISTER NOW <i class="fa-solid fa-user-plus"></i>';
                regBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
